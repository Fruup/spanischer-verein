name: spanischer-verein
services:
  web:
    build:
      context: .
      dockerfile: .docker/web/Dockerfile
      target: production
    ports:
      - ${PORT}:${PORT}
    labels:
      # Redirect to non-www
      - traefik.http.middlewares.redirect-to-non-www.redirectregex.regex=^https?://www\.(.*)
      - traefik.http.middlewares.redirect-to-non-www.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.redirect-to-non-www.redirectregex.permanent=true
    environment:
      ORIGIN: ${ORIGIN}
      PORT: ${PORT}

      SANITY_PERSPECTIVE: ${SANITY_PERSPECTIVE}
      SANITY_DATASET: ${SANITY_DATASET}
      SANITY_TOKEN: ${SANITY_TOKEN}

      HOSTINGER_MAIL_API_TOKEN: ${HOSTINGER_MAIL_API_TOKEN}
      HOSTINGER_MAIL_ADDRESS: ${HOSTINGER_MAIL_ADDRESS}
      HOSTINGER_MAIL_SENDER: ${HOSTINGER_MAIL_SENDER}
      ADMIN_MAIL_ADDRESS: ${ADMIN_MAIL_ADDRESS}
      ALTCHA_SECRET: ${ALTCHA_SECRET}
